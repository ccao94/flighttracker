services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flighttracker
      POSTGRES_PASSWORD: flighttracker
      POSTGRES_DB: flighttracker
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flighttracker -d flighttracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/flighttracker
      SPRING_DATASOURCE_USERNAME: flighttracker
      SPRING_DATASOURCE_PASSWORD: flighttracker
      SPRING_JPA_SHOW_SQL: "false"
      OPENSKY_CLIENT_ID: ${OPENSKY_CLIENT_ID:-}
      OPENSKY_CLIENT_SECRET: ${OPENSKY_CLIENT_SECRET:-}
      FLIGHTTRACKER_ADMIN_KEY: ${FLIGHTTRACKER_ADMIN_KEY:-}
    ports:
      - "8080:8080"
    mem_limit: 512m

volumes:
  pgdata: