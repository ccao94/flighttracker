spring:
  application:
    name: flighttracker
  datasource:
    url: jdbc:postgresql://localhost:5434/flighttracker
    username: flighttracker
    password: flighttracker
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

opensky:
  base-url: https://opensky-network.org/api
  token-url: https://auth.opensky-network.org/auth/realms/opensky-network/protocol/openid-connect/token
  client-id: ${OPENSKY_CLIENT_ID:}
  client-secret: ${OPENSKY_CLIENT_SECRET:}

flighttracker:
  collector:
    enabled: true
    interval: PT1M
    initial-delay: PT30S